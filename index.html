        }

        /* Animations Zone Détails */
        .details-section {

            overflow: hidden; 
            opacity: 0; 
        }
        .details-section.visible {

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #3498db; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }

        input, select, textarea { font-size: 16px !important; }

        #console-log {
            display: none;
            background: #1e293b;
            color: #4ade80;
            font-family: monospace;
            font-size: 10px;

            border-top: 2px solid #334155;

        const compressImage = async (file, { quality = 0.5, type = 'image/jpeg' } = {}) => {
            return new Promise((resolve, reject) => {
                const image = new Image();
                const src = URL.createObjectURL(file);
                image.src = src;
                
                image.onload = () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const maxWidth = 1024; 
                    let width = image.width;
                    let height = image.height;

                    if (width > maxWidth) {
                        height *= maxWidth / width;
                        width = maxWidth;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    ctx.drawImage(image, 0, 0, width, height);
                    URL.revokeObjectURL(src);

                    canvas.toBlob((blob) => {
                        canvas.width = 0; canvas.height = 0;
                        if (!blob) { reject(new Error('Erreur compression')); return; }
                        const newFile = new File([blob], file.name.replace(/\.[^/.]+$/, "") + ".jpg", { type: type, lastModified: Date.now() });
                        resolve(newFile);
                    }, type, quality);
                };
                image.onerror = (error) => { URL.revokeObjectURL(src); reject(error); }
            });
        };

        function handleStatusChange(radio) {

            const manualBtn = container.querySelector('.manual-add-btn');
            const textArea = container.querySelector('textarea');

            if (radio.value === 'nok') {

                manualBtn.classList.add('hidden');

                container.classList.remove('bg-slate-50', 'border-slate-200');

                    : `<span class="bg-red-100 text-red-800 px-2 py-1 rounded-md text-xs font-bold border border-red-200">${nokCount} Défauts</span>`;
                const card = document.createElement('div');
                card.className = "bg-white p-4 rounded-2xl shadow-sm border border-slate-100 active:border-blue-300 active:bg-slate-50 cursor-pointer flex justify-between items-center transition";
                card.onclick = () => loadDetails(f.id);
                card.innerHTML = `<div><div class="flex items-center gap-2 font-black text-lg text-slate-800">${f.immatriculation || '---'} ${badge}</div><div class="text-slate-600 font-medium">${f.vehicule_modele}</div><div class="text-slate-400 text-xs mt-1 flex items-center gap-1"><i class="ph ph-user"></i> ${f.client_nom} &bull; ${new Date(f.created_at).toLocaleDateString()}</div></div><i class="ph ph-caret-right text-slate-300 text-2xl"></i>`;
                listEl.appendChild(card);
            });
        }

        async function submitExpertise() {
            log("--- Début Sauvegarde ---");
            const btn = document.getElementById('btnSave'); 
            const originalText = document.getElementById('saveBtnText').innerText;
            
            // 1. Validation Champs
            const client = document.getElementById('clientName').value.trim();
            const plate = document.getElementById('plate').value.trim();
            const model = document.getElementById('model').value.trim();
            const km = document.getElementById('km').value.trim();

            if (!client || !plate || !model || !km) {
                log("Validation échouée: champs manquants");
                alert("⚠️ Attention : Veuillez remplir les 4 champs en haut (Client, Immatriculation, Modèle, Km).");
                document.getElementById('clientName').scrollIntoView({behavior: "smooth"});
                return; 
            }

            // 2. Blocage bouton
            btn.disabled = true; 
            document.getElementById('saveBtnText').innerText = "Sauvegarde en cours...";
            
            try {
                // 3. Construction Données
                log("Construction des données...");
                const checklistData = {};
                document.querySelectorAll('.control-item').forEach(div => {
                    try {
                        const id = div.dataset.id;
                        const checked = div.querySelector(`input[name="${id}"]:checked`);
                        if(checked) {
                            checklistData[id] = { 
                                status: checked.value, 
                                comment: div.querySelector('textarea').value, 
                                photos: itemPhotos[id] || [] 
                            };
                        }
                    } catch(errItem) {
                        log("Erreur sur item: " + div.dataset.id);
                    }
                });

                log(`Items cochés: ${Object.keys(checklistData).length}`);

                const payload = {
                    client_nom: client,
                    immatriculation: plate,
                    vehicule_modele: model,
                    km: km,
                    checklist: checklistData,
                    photo_url: globalPhotos[0] || null
                };

                const id = document.getElementById('expertiseId').value;
                log(id ? `Mise à jour ID: ${id}` : "Création nouveau dossier");

                // 4. Envoi Supabase
                const savePromise = id ? sb.from('expertises').update(payload).eq('id', id) : sb.from('expertises').insert([payload]);
                
                // Timeout sécurité
                const timeoutPromise = new Promise((_, reject) => setTimeout(() => reject(new Error('Timeout Réseau (15s)')), 15000));
                
                const { error } = await Promise.race([savePromise, timeoutPromise]);

                if(error) {
                    log("Erreur Supabase: " + JSON.stringify(error));
                    throw error;
                }

                log("Sauvegarde OK !");
                btn.classList.remove('bg-blue-900'); btn.classList.add('bg-green-600');
                document.getElementById('saveBtnText').innerText = "Succès !";
                
                setTimeout(() => { 
                    btn.classList.add('bg-blue-900'); btn.classList.remove('bg-green-600'); 
                    document.getElementById('saveBtnText').innerText = originalText; 
                    btn.disabled = false; // IMPORTANT: Réactiver le bouton
                    showDashboard(); 
                }, 1000);

            } catch (e) { 
                log("EXCEPTION: " + e.message);
                alert("Erreur technique : " + e.message); 
                btn.disabled = false; 
                document.getElementById('saveBtnText').innerText = originalText; 
            } 
        }

        async function loadDetails(id) {
            log("Chargement détail: " + id);
            try {
                const { data, error } = await sb.from('expertises').select('*').eq('id', id).single();
                if(error) throw error;
                resetForm();
                document.getElementById('expertiseId').value = data.id;
                document.getElementById('formModeTitle').innerText = "Modification";
                document.getElementById('btnReport').classList.remove('hidden');
                document.getElementById('btnDelete').classList.remove('hidden');
                document.getElementById('clientName').value = data.client_nom;
                document.getElementById('plate').value = data.immatriculation;
                document.getElementById('model').value = data.vehicule_modele;
                document.getElementById('km').value = data.km;
                
                if(data.photo_url) { globalPhotos.push(data.photo_url); renderPhoto(data.photo_url, document.getElementById('globalPhotoList'), () => globalPhotos=[]); }
                
                if(data.checklist) {
                    for(const [id, info] of Object.entries(data.checklist)) {
                        const div = document.querySelector(`.control-item[data-id="${id}"]`);
                        if(div) {
                            const radio = div.querySelector(`input[value="${info.status}"]`);
                            if(radio) {
                                radio.checked = true;
                                handleStatusChange(radio);
                            }
                            div.querySelector('textarea').value = info.comment || '';
                            if(info.status === 'ok' && (info.comment || (info.photos && info.photos.length > 0))) {
                                div.querySelector('.details-section').classList.add('visible');
                            }
                            if(info.photos) { 
                                itemPhotos[id] = info.photos; 
                                info.photos.forEach(src => renderPhoto(src, div.querySelector('.photos-container'), () => itemPhotos[id]=itemPhotos[id].filter(u=>u!==src))); 
                            }
                        }
                    }
                }
                document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
                document.getElementById('view-form').classList.add('active');
                window.scrollTo(0,0);
            } catch(e) { log("Erreur loadDetails: " + e.message); alert('Impossible de charger ce dossier.'); }
        }

        async function deleteExpertise() {
            if(confirm("Supprimer ?")) {
                const id = document.getElementById('expertiseId').value;
                await sb.from('expertises').delete().eq('id', id);
                showDashboard();
            }
        }

        // ================= GESTION PHOTOS =================
        function triggerGlobalPhoto() { currentPhotoTarget='global'; document.getElementById('cameraInput').click(); }
        function triggerItemPhoto(btn) { currentPhotoTarget=btn.closest('.control-item').dataset.id; document.getElementById('cameraInput').click(); }
        
        async function handlePhotoUpload(input) {
            log("Upload photo démarré...");
            if (input.files && input.files[0]) {
                const file = input.files[0];
                const container = currentPhotoTarget === 'global' ? document.getElementById('globalPhotoList') : document.querySelector(`.control-item[data-id="${currentPhotoTarget}"] .photos-container`);
                const l = document.createElement('div'); l.className="w-20 h-20 bg-slate-100 rounded flex items-center justify-center"; l.innerHTML='<div class="loader"></div>'; container.appendChild(l);
                
                try {
                    const compressedFile = await compressImage(file, { quality: 0.5 }); 
                    const name = `${Date.now()}_${compressedFile.name.replace(/\W/g,'_')}`;
                    log("Fichier compressé, envoi Supabase...");
                    
                    const { error } = await sb.storage.from(STORAGE_BUCKET).upload(name, compressedFile);
                    if(error) throw error;
                    const { data } = sb.storage.from(STORAGE_BUCKET).getPublicUrl(name);
                    const url = data.publicUrl; l.remove();
                    log("Upload OK: " + url);
                    
                    if(currentPhotoTarget==='global') { globalPhotos.push(url); renderPhoto(url, container, () => globalPhotos=globalPhotos.filter(u=>u!==url)); }
                    else { if(!itemPhotos[currentPhotoTarget]) itemPhotos[currentPhotoTarget]=[]; itemPhotos[currentPhotoTarget].push(url); renderPhoto(url, container, () => itemPhotos[currentPhotoTarget]=itemPhotos[currentPhotoTarget].filter(u=>u!==url)); }
                } catch(e) { l.remove(); log("Erreur upload: " + e.message); alert("Erreur upload: " + e.message); }
            } input.value = '';
        }
        
        function renderPhoto(src, container, cb) {
            const div = document.createElement('div'); div.className = "relative group w-24 h-24";
            div.innerHTML = `<img src="${src}" class="w-full h-full object-cover rounded-xl border border-slate-200" onclick="window.open('${src}')"><button type="button" class="absolute top-0 right-0 bg-red-600 text-white p-1 rounded-bl-xl rounded-tr-xl shadow text-xs">X</button>`;
            div.querySelector('button').onclick = (e) => { e.stopPropagation(); if(confirm('Supprimer ?')) { div.remove(); cb(); } };
            container.appendChild(div);
        }

        // ================= RAPPORT COMPLET =================
        function generateReport() {
            const client = document.getElementById('clientName').value;
            const plate = document.getElementById('plate').value;
            const model = document.getElementById('model').value;
            const km = document.getElementById('km').value;
            const today = new Date().toLocaleDateString('fr-FR');
            
            let globalPhotosHTML = '';
            globalPhotos.forEach(url => globalPhotosHTML += `<img src="${url}" class="w-full h-48 object-cover rounded-lg border border-slate-200">`);

            let controlRows = '';
            
            for (const [key, section] of Object.entries(checkListConfig)) {
                let sectionItemsHTML = '';
                let hasItems = false;

                section.items.forEach(item => {
                    const el = document.querySelector(`.control-item[data-id="${item.id}"]`);
                    if(!el) return;
                    
                    const statusOk = el.querySelector(`input[value="ok"]:checked`);
                    const statusNok = el.querySelector(`input[value="nok"]:checked`);
                    
                    if(statusOk || statusNok) {
                        hasItems = true;
                        const isNok = !!statusNok;
                        const statusBadge = isNok 
                            ? `<span class="text-red-600 font-bold">DÉFAUT</span>` 
                            : `<span class="text-green-600 font-bold">CONFORME</span>`;
                        
                        const comment = el.querySelector('textarea').value;
                        const photosDiv = el.querySelector('.photos-container');
                        let itemPhotosHTML = '';
                        if(photosDiv) {
                            photosDiv.querySelectorAll('img').forEach(img => {
                                itemPhotosHTML += `<img src="${img.src}" class="w-16 h-16 object-cover rounded border border-slate-300 inline-block mr-1">`;
                            });
                        }

                        const bgClass = isNok ? 'bg-red-50' : 'bg-white';
                        
                        sectionItemsHTML += `
                        <tr class="${bgClass} border-b border-slate-200 print-break">
                            <td class="p-2 w-1/3 align-top">
                                <div class="font-bold text-slate-700">${item.label}</div>
                                <div class="text-xs text-slate-500">${item.sub}</div>
                            </td>
                            <td class="p-2 w-1/6 align-top text-center">${statusBadge}</td>
                            <td class="p-2 align-top">
                                <div class="text-sm text-slate-800">${comment || '-'}</div>
                                <div class="mt-1">${itemPhotosHTML}</div>
                            </td>
                        </tr>`;
                    }
                });

                if(hasItems) {
                    controlRows += `
                    <tr class="bg-slate-100 border-b-2 border-slate-300">
                        <td colspan="3" class="p-2 font-bold text-blue-900 uppercase text-sm"><i class="ph ph-${section.icon}"></i> ${section.title}</td>
                    </tr>
                    ${sectionItemsHTML}`;
                }
            }

            const html = `
            <div class="max-w-4xl mx-auto p-8 bg-white text-sm">
                <div class="flex justify-between items-center border-b-2 border-blue-800 pb-4 mb-6">
                    <div><h1 class="text-2xl font-bold text-blue-900">AUDIT VÉHICULE D'OCCASION</h1><p class="text-slate-500">Réf: ${plate} - ${today}</p></div>
                    <div class="text-right"><div class="text-xl font-bold text-slate-700">APEX AUTO SERVICE</div><div class="text-sm">Inspection Complète</div></div>
                </div>
                
                <div class="grid grid-cols-4 gap-4 mb-6 bg-slate-50 p-4 rounded-xl border border-slate-200">
                    <div><p class="text-xs uppercase text-slate-500 font-bold">Client</p><p class="font-bold">${client}</p></div>
                    <div><p class="text-xs uppercase text-slate-500 font-bold">Véhicule</p><p class="font-bold">${model}</p></div>
                    <div><p class="text-xs uppercase text-slate-500 font-bold">Plaque</p><p class="font-bold font-mono">${plate}</p></div>
                    <div><p class="text-xs uppercase text-slate-500 font-bold">Km</p><p class="font-bold">${km}</p></div>
                </div>

                <h3 class="font-bold text-lg mb-2 text-blue-900 border-b pb-1">Détail des points de contrôle</h3>
                <table class="w-full text-left border-collapse mb-6">
                    <thead>
                        <tr class="text-xs uppercase text-slate-500 border-b border-slate-300">
                            <th class="p-2">Point de contrôle</th>
                            <th class="p-2 text-center">État</th>
                            <th class="p-2">Observations / Photos</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${controlRows}
                    </tbody>
                </table>

                <div class="print-newpage">
                    <h3 class="font-bold text-lg mb-4 text-blue-900 border-b pb-1">Album Photo Global</h3>
                    <div class="grid grid-cols-3 gap-4 mb-8">
                        ${globalPhotosHTML || '<p class="text-slate-400 italic">Aucune photo globale.</p>'}
                    </div>
                </div>

                <div class="print-break mt-10 pt-4 border-t-2 border-slate-300">
                    <h3 class="font-bold text-xs mb-1 uppercase">CGV & Mentions Légales</h3>
                    <div class="legal-text">
                        <p><strong>Art 1 - Prestation :</strong> Inspection visuelle et auditive, obligation de moyens. Avis technique sur l'état apparent.</p>
                        <p><strong>Art 2 - Limites :</strong> Pas de démontage. Ne couvre pas l'interne moteur/boîte ni l'électronique profonde.</p>
                        <p><strong>Art 3 - Vices Cachés :</strong> Le Prestataire n'est pas vendeur. Garantie vices cachés incombe au vendeur (Art 1641 Code Civil).</p>
                        <p><strong>Art 4 - Indépendance :</strong> Aide à la décision, ne remplace pas le CT. Pas de responsabilité en cas de non-vente.</p>
                        <p><strong>Art 5 - Essai :</strong> Le Vendeur garde la garde juridique du véhicule et certifie l'assurance.</p>
                    </div>
                </div>
                <div class="mt-4 text-center text-xs text-slate-400">Document généré par APEX AUTO SERVICE le ${today}</div>
            </div>`;

            const reportDiv = document.getElementById('view-report');
            reportDiv.innerHTML = html;
            
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            reportDiv.classList.remove('hidden');
            
            setTimeout(() => { 
                window.print(); 
                reportDiv.classList.add('hidden'); 
                document.getElementById('view-form').classList.add('active'); 
            }, 500);
        }

        // Helpers
        function resetForm() {
            document.getElementById('expertiseForm').reset();
            document.getElementById('expertiseId').value = '';
            document.getElementById('formModeTitle').innerText = "Nouvelle Fiche";
            document.querySelectorAll('.details-section').forEach(s => s.classList.remove('visible'));
            document.querySelectorAll('.manual-add-btn').forEach(b => b.classList.add('hidden'));
            document.querySelectorAll('.control-item').forEach(c => {
                c.classList.remove('bg-red-50', 'border-red-200');
                c.classList.add('bg-slate-50', 'border-slate-200');
            });
            document.querySelectorAll('.photos-container, #globalPhotoList').forEach(c => c.innerHTML = '');
            globalPhotos = []; itemPhotos = {};
        }
    </script>
</body>
